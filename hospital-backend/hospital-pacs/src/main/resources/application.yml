server:
  port: 9104
  tomcat:
    max-http-form-post-size: 536870912
    max-swallow-size: 536870912

spring:
  application:
    name: hospital-pacs
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:hospital}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

hospital:
  auth:
    jwt:
      secret: ${JWT_SECRET:hospital-dev-secret-key-change-in-production-min-32-chars!!}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9001}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:imaging}
  ai:
    base-url: ${HOSPITAL_AI_BASE_URL:http://127.0.0.1:8000}
    callback-url: ${HOSPITAL_AI_CALLBACK_URL:http://127.0.0.1:9104/internal/imaging/callback}
    inference-timeout-seconds: 180
  ai-bridge:
    base-url: ${HOSPITAL_AI_BRIDGE_BASE_URL:http://127.0.0.1:9106}
    report-timeout-seconds: ${HOSPITAL_AI_BRIDGE_REPORT_TIMEOUT_SECONDS:180}
