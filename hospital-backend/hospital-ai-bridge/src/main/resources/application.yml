server:
  port: 9106

spring:
  application:
    name: hospital-ai-bridge
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:hospital}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
  ai:
    openai:
      api-key: ${DASH_SCOPE_API_KEY:${DASHSCOPE_API_KEY:disabled}}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen-plus}
          temperature: 0.2
      # DashScope 提供 OpenAI 兼容的 Embedding API，供医生端 RAG 查询和知识入库使用。
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1024}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}

hospital:
  auth:
    jwt:
      secret: ${JWT_SECRET:hospital-dev-secret-key-change-in-production-min-32-chars!!}
  his:
    base-url: ${HOSPITAL_HIS_BASE_URL:http://127.0.0.1:9102}
  ai:
    enabled: ${HOSPITAL_AI_ENABLED:true}
    max-rounds: ${HOSPITAL_AI_MAX_ROUNDS:5}
    max-follow-up-rounds: ${HOSPITAL_AI_MAX_FOLLOW_UP_ROUNDS:3}
    safety-notice: 本结果仅用于就诊分诊参考，不能替代医生诊断。如症状严重或持续加重，请及时就医；如出现胸痛、呼吸困难、意识障碍、大出血等情况，请立即前往急诊或拨打 120。
    rag:
      enabled: ${HOSPITAL_AI_RAG_ENABLED:true}
      # 开发/第一版自动建表；生产环境可关闭并改用数据库迁移脚本管理。
      initialize-schema: ${HOSPITAL_AI_RAG_INITIALIZE_SCHEMA:true}
      dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1024}
      top-k: ${HOSPITAL_AI_RAG_TOP_K:6}
      similarity-threshold: ${HOSPITAL_AI_RAG_SIMILARITY_THRESHOLD:0.55}
