server:
  port: 9108

spring:
  application:
    name: hospital-patient
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:hospital}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000

hospital:
  auth:
    jwt:
      secret: ${JWT_SECRET:hospital-dev-secret-key-change-in-production-min-32-chars!!}
  wechat:
    mock-enabled: true
  internal:
    service-name: hospital-patient
    allowed-callers:
      - hospital-pharmacy
      - hospital-his
  clinical-sync:
    retry-interval-ms: 30000
