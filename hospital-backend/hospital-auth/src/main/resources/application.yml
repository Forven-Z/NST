server:
  port: 9101

spring:
  application:
    name: hospital-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:hospital}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

hospital:
  auth:
    jwt:
      secret: ${JWT_SECRET:hospital-dev-secret-key-change-in-production-min-32-chars!!}
      access-token-expire-seconds: 7200
      refresh-token-expire-seconds: 604800
    internal:
      header: X-Internal-Service
      allowed-services:
        - hospital-his
        - hospital-management
        - hospital-management
